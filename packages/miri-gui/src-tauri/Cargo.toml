[package]
name = "miri-gui-backend"
version = "0.1.0"
description = "Miri Cleaner Tauri GUI Desktop Backend"
authors = ["Miri Cleaner Contributors"]
edition = "2021"

[dependencies]
miri-core = { path = "../../../crates/miri-core" }
tauri = { version = "2.2", features = [] }
tauri-plugin-shell = "2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }

[build-dependencies]
tauri-build = { version = "2.2", features = [] }
